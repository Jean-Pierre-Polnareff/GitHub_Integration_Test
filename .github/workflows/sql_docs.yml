name: SQL Stored Procedure Documentation

on:
  push:
    branches: [main]
    paths:
      - 'SQL/**/Stored Procedures/*.sql'

permissions:
  contents: write

jobs:
  sql-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: main

      - name: Checkout wiki repo
        uses: actions/checkout@v4
        with:
          repository: Jean-Pierre-Polnareff/GitHub_Integration_Test.wiki
          token: ${{ secrets.WIKI_TOKEN }}
          path: wiki

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      - name: Detect changed stored procedures
        id: detect
        run: |
          cd main

          SINCE="${{ github.event.before }}"
          NOW="${{ github.event.after }}"

          if [ "$SINCE" = "0000000000000000000000000000000000000000" ]; then
            SINCE=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGES=$(git diff --name-status -M $SINCE $NOW \
          | awk -F'\t' '
            {
              status = $1
              path   = $2
              if (path ~ /^SQL\/.*\/Stored Procedures\/.*\.sql$/) {
                if (status == "A") label = "CREATED"
                else if (status == "D") label = "DELETED"
                else if (status ~ /^M/) label = "MODIFIED"
                else next
                print label "|" path
              }
            }
          ')

          if [ -z "$CHANGES" ]; then
            echo "No stored procedure changes detected."
            exit 0
          fi

          touch sql_changelog.md

          python3 - <<EOF
          import re
          from datetime import datetime, timezone

          date        = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          raw_changes = """$CHANGES"""

          incoming = {}
          for line in raw_changes.strip().split("\n"):
              parts = line.split("|", 1)
              if len(parts) == 2:
                  status, path = parts
                  incoming[path.strip()] = status.strip()

          try:
              with open("sql_changelog.md", "r") as f:
                  content = f.read()
          except FileNotFoundError:
              content = ""

          sections = re.split(r'(?=^## \d{4}-\d{2}-\d{2})', content, flags=re.MULTILINE)
          sections = [s for s in sections if s.strip()]

          if sections and sections[0].startswith(f"## {date}"):
              existing = {}
              for line in sections[0].split("\n"):
                  line = line.strip()
                  if ":" in line and not line.startswith("#") and not line.startswith("-"):
                      parts = line.split(":", 1)
                      if len(parts) == 2:
                          status = parts[0].strip()
                          path   = parts[1].strip()
                          if status in ("CREATED", "MODIFIED", "DELETED"):
                              existing[path] = status
              for path, new_status in incoming.items():
                  if path not in existing:
                      existing[path] = new_status
                  else:
                      ex = existing[path]
                      if ex == "CREATED" and new_status == "DELETED":
                          existing[path] = "DELETED"
                      elif ex == "MODIFIED" and new_status == "DELETED":
                          existing[path] = "DELETED"
                      elif ex == "DELETED" and new_status == "CREATED":
                          existing[path] = "CREATED"
              lines = [f"{status}: {path}" for path, status in existing.items()]
              sections[0] = f"## {date}\n\n" + "\n".join(lines) + "\n\n---\n"
          else:
              lines     = [f"{status}: {path}" for path, status in incoming.items()]
              new_entry = f"## {date}\n\n" + "\n".join(lines) + "\n\n---\n"
              sections.insert(0, new_entry)

          trimmed = sections[:30]
          with open("sql_changelog.md", "w") as f:
              f.write("\n".join(trimmed).strip() + "\n")
          EOF

          CHANGES_ARG=$(echo "$CHANGES" | tr '\n' ',' | sed 's/,$//')
          echo "changes_arg=$CHANGES_ARG" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Generate SQL docs
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          cd main
          python generate_sql_docs.py \
            --main-repo "." \
            --wiki-repo "../wiki" \
            --sql-root "SQL" \
            --openrouter-key "${{ secrets.OPENROUTER_KEY }}" \
            --changes "${{ steps.detect.outputs.changes_arg }}"

      - name: Commit tracking files to main repo
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          cd main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sql_changelog.md
          [ -f backlog.json ] && git add backlog.json || true
          git diff --staged --quiet || (git commit -m "chore: update SQL docs tracking $(date -u +%Y-%m-%d)" && git pull --rebase && git push)

      - name: Push wiki repo
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: update SQL stored procedure docs $(date -u +%Y-%m-%d)" && git pull --rebase && git push)